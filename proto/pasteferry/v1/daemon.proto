// Flutter UI ↔ Go daemon 之间的接口。
//
// daemon 是常驻后台的核心进程，UI 只是控制台——关掉 UI 不影响同步。
// 事件走 server-streaming 主动推送，避免 UI 轮询。

syntax = "proto3";

package pasteferry.v1;

option go_package = "github.com/baiyuze/pasteferry/proto/gen/pasteferry/v1;pasteferryv1";

service DaemonService {
  // 订阅事件流。UI 启动后第一件事，断线需重连。
  rpc Subscribe(SubscribeRequest) returns (stream Event);

  rpc ListHistory(ListHistoryRequest) returns (ListHistoryResponse);
  rpc DeleteHistory(DeleteHistoryRequest) returns (Empty);

  // 拉取仅有元数据的大文件记录。立即返回，进度走事件流。
  rpc Fetch(FetchRequest) returns (Empty);
  // 把某条已就绪的记录重新放进本机剪贴板
  rpc ApplyToClipboard(ApplyToClipboardRequest) returns (Empty);
  // 只返回已就绪图片（或图片文件）在本机的路径，不改动剪贴板，也不把路径发给对端。
  rpc GetImagePreview(GetImagePreviewRequest) returns (GetImagePreviewResponse);

  rpc ListDevices(Empty) returns (ListDevicesResponse);
  rpc CreatePairingCode(Empty) returns (CreatePairingCodeResponse);
  rpc RedeemPairingCode(RedeemPairingCodeRequest) returns (RedeemPairingCodeResponse);
  // 配对双方各自确认指纹后才真正互信
  rpc ConfirmPairing(ConfirmPairingRequest) returns (Empty);
  rpc Unpair(UnpairRequest) returns (Empty);
  // 重新连接：已是直连时什么也不做；否则马上再试一次直连，打不通照旧走中转。
  // 最多等十几秒，返回那时的连接状态
  rpc Reconnect(ReconnectRequest) returns (ReconnectResponse);
  // 手动告诉后台服务某台设备的局域网地址：跨网段、或两边都换了地址时用
  rpc SetDeviceAddress(SetDeviceAddressRequest) returns (Empty);
  // 「搜索附近设备」窗口打开期间保持这个调用，窗口关掉时取消。期间本机在局域网里公开设备名，
  // 并在附近同样打开了这个窗口的设备有变化时推送最新的列表
  rpc WatchNearby(Empty) returns (stream NearbyDevices);
  // 向附近的一台设备发起配对。之后与 RedeemPairingCode 一样，双方核对指纹后各自 ConfirmPairing
  rpc PairNearby(PairNearbyRequest) returns (RedeemPairingCodeResponse);

  rpc GetConfig(Empty) returns (Config);
  rpc UpdateConfig(Config) returns (Config);

  rpc GetStatus(Empty) returns (Status);
  // 引导用户授予剪贴板权限（打开系统设置面板）
  rpc RequestClipboardPermission(Empty) returns (Empty);
  // 让系统放行局域网访问：macOS 打开「本地网络」设置面板；
  // Windows 申请管理员权限，在防火墙里放行后台服务。其他平台返回 UNIMPLEMENTED。
  rpc RequestLocalNetworkPermission(Empty) returns (Empty);

  // These belong to the background service, which also notifies with the UI closed.
  rpc GetNotificationStatus(Empty) returns (NotificationStatus);
  rpc RequestNotificationPermission(Empty) returns (NotificationStatus);
  rpc ActivateNotification(NotificationAction) returns (Empty);

  // 网络出口与打洞诊断：本机有几个出口、各自的公网地址，见 pasteferry-cli nat
  rpc GetNetwork(Empty) returns (NetworkInfo);

  // 反馈问题用的诊断报告：版本、系统、设置、设备与网络状态、最近的日志。
  // 设备名、服务器地址、公网 IP、用户目录、文件名已换成占位符，用户看过后自己贴进 issue
  rpc ExportDiagnostics(ExportDiagnosticsRequest) returns (Diagnostics);
  // 临时打开详细日志（调试级别），到时间自动关回去；minutes 为 0 立即关闭
  rpc SetVerboseLog(SetVerboseLogRequest) returns (Status);

  // 检查更新：从 GitHub 与 Gitee 同时取更新清单，验签后返回比当前新的各版更新日志。见 design/auto-update.md
  rpc CheckForUpdate(CheckForUpdateRequest) returns (UpdateInfo);
  // 下载并校验最近一次检查到的新版本。取消调用即停止下载
  rpc DownloadUpdate(DownloadUpdateRequest) returns (stream UpdateProgress);
  // 准备好新版本并启动更新助手。返回后界面应当立即退出：助手等它退出后替换文件，再重新打开
  rpc InstallUpdate(InstallUpdateRequest) returns (Empty);

  // 收藏或取消收藏，见 design/quick-paste-and-favorites.md 第 3 节。
  // 收藏时另存一份，返回新的收藏记录；取消时把收藏放回复制记录的最上面，返回放回去的那一条。
  // 过程中照常推送 clip_added / clip_removed。已过期或已失败的图片、文件返回 FAILED_PRECONDITION
  rpc SetFavorite(SetFavoriteRequest) returns (ClipRecord);
  // 悬停提示框要显示的完整内容。ClipRecord 的 text_preview 最多 120 个字、换行被压平，不够用
  rpc GetClipDetail(GetClipDetailRequest) returns (ClipDetail);
  // 给收藏起个别名，列表里显示别名、搜索也认它。alias 为空表示去掉别名
  rpc SetAlias(SetAliasRequest) returns (ClipRecord);

  // 快捷粘贴窗口进程启动后一直保持这个调用：往上报自己的状态，往下收设置页发来的命令。
  // 调用断开就当作快捷窗口没在运行
  rpc QuickPasteSession(stream QuickPasteStatus) returns (stream QuickPasteCommand);
  // 设置页读快捷窗口的状态；状态变化时另有 quick_paste_changed 事件
  rpc GetQuickPasteStatus(Empty) returns (QuickPasteStatus);
  // 设置页转给快捷窗口的命令。快捷窗口没在运行时返回 FAILED_PRECONDITION
  rpc SendQuickPasteCommand(QuickPasteCommand) returns (Empty);

  // ── 隔空传送：把文件直接发给某一台设备，见 design/send-files.md ──
  // 发给一台设备。立即返回这一批的记录，之后的状态与进度走 transfer_changed 事件。
  // 对方不在线或不支持时返回 FAILED_PRECONDITION；路径不存在返回 INVALID_ARGUMENT。
  // 要经官方服务中转而 allow_relay 为 false 时返回 FAILED_PRECONDITION，消息为 "relay"，界面确认后再调一次
  rpc SendFiles(SendFilesRequest) returns (Transfer);
  // 取消一批（发出的或收到的都可以），两边都停下
  rpc CancelTransfer(TransferRef) returns (Empty);
  // 发出的、已中断的一批从断点继续；对方已清掉没收完的部分时从头再发
  rpc ResumeTransfer(TransferRef) returns (Empty);
  rpc ListTransfers(ListTransfersRequest) returns (ListTransfersResponse);
  // 只删记录，不删文件；进行中的不删
  rpc DeleteTransfers(DeleteTransfersRequest) returns (Empty);
  // 打开隔空传送页时调用：收到的都标为看过，侧边栏的数字清零
  rpc MarkTransfersSeen(Empty) returns (Empty);
  // 检查保存位置能否写入。path 为空时检查当前设置的位置。
  // 在 macOS 上会在这时触发系统的文件夹授权弹窗，所以要在用户看着界面时调用
  rpc CheckReceiveDir(CheckReceiveDirRequest) returns (CheckReceiveDirResponse);
  // 别人发来的、在等用户接受的一批：接受或拒绝。always 表示以后自动接收这个好友的文件
  rpc AnswerIncoming(AnswerIncomingRequest) returns (Empty);

  // ── 好友，见 design/friends-send.md ──
  rpc GetProfile(Empty) returns (Profile);
  rpc SetDisplayName(SetDisplayNameRequest) returns (Profile);
  // 设置头像：图片文件或剪贴板里的图片，按裁剪区域裁成正方形，处理成 256×256 的 JPEG
  rpc SetAvatar(SetAvatarRequest) returns (Profile);
  rpc ResetAvatar(Empty) returns (Profile);
  // 本机或某个好友的头像（JPEG）。没有自定义头像时为空
  rpc GetAvatar(GetAvatarRequest) returns (Avatar);
  // 生成好友码（F 加 6 位），5 分钟有效。别人兑换后推送 friend_request 事件
  rpc CreateFriendCode(Empty) returns (CreatePairingCodeResponse);
  // 输入好友码，返回对方的名片和会话；用户在确认框里点了以后调 ConfirmFriend
  rpc RedeemFriendCode(RedeemPairingCodeRequest) returns (FriendRequest);
  rpc ConfirmFriend(ConfirmPairingRequest) returns (Empty);
  rpc ListFriends(Empty) returns (ListFriendsResponse);
  rpc RemoveFriend(FriendRef) returns (Empty);
  rpc SetFriendAutoAccept(SetFriendAutoAcceptRequest) returns (Friend);
  // 「所有人」模式下拒绝过的陌生设备，以后它的请求直接拒绝
  rpc BlockDevice(FriendRef) returns (Empty);

  // 发送页里输入的文字：当成本机复制，落库并发给其他设备，不写本机剪贴板（Android App，design/phone-sync.md 3.3.2 节）
  rpc SubmitText(SubmitTextRequest) returns (ClipRecord);

  // 手机网页传输（design/phone-sync.md 第 2 节）：手机扫码后用浏览器和本机互传
  rpc GetWebShare(Empty) returns (WebShareStatus);
  // 打开或关闭总开关。关闭时停止监听端口，已登记的手机保留
  rpc SetWebShare(SetWebShareRequest) returns (WebShareStatus);
  // 二维码窗口打开、或上一个二维码被用掉 / 过期时调用：生成一个待用的会话，返回二维码里的网址
  rpc NewWebShareInvite(NewWebShareInviteRequest) returns (WebShareInvite);
  // 二维码窗口关闭：作废还没被用过的二维码
  rpc CloseWebShareInvite(WebShareInviteRef) returns (Empty);
  // 移除一台登记过的手机，它的网页立即失效
  rpc RemoveWebSession(WebSessionRef) returns (WebShareStatus);
  // 发送窗口、头像里的「粘贴」：剪贴板里是文件时返回它们的路径；是图片时存成 PNG，返回这个文件的路径
  rpc PasteFiles(Empty) returns (PasteFilesResponse);
  // 隔空传送页打开期间保持这个调用：推送附近开着「所有人」的陌生设备（只在局域网里）
  rpc WatchStrangers(Empty) returns (stream Strangers);
}

message Empty {}

// ─────────────────────────── 剪贴板记录 ───────────────────────────

enum ClipKind {
  CLIP_KIND_UNSPECIFIED = 0;
  CLIP_KIND_TEXT = 1;
  CLIP_KIND_HTML = 2;
  CLIP_KIND_IMAGE = 3;
  CLIP_KIND_FILE = 4;   // 文件或文件夹，可多个
}

enum ClipStatus {
  CLIP_STATUS_UNSPECIFIED = 0;
  CLIP_STATUS_READY = 1;        // 内容已在本地，可直接粘贴
  CLIP_STATUS_REMOTE_ONLY = 2;  // 超过阈值，只有元数据，需手动拉取
  CLIP_STATUS_FETCHING = 3;
  CLIP_STATUS_FAILED = 4;
  CLIP_STATUS_EXPIRED = 5;      // 超过 cache_ttl，内容已被 GC 删除
}

message ClipItem {
  string name = 1;
  int64 size = 2;
  bool is_dir = 3;
  string content_type = 4;  // UTType 标识符，如 public.plain-text
}

message ClipRecord {
  string id = 1;
  ClipKind kind = 2;
  ClipStatus status = 3;

  string origin_device_id = 4;
  string origin_device_name = 5;
  bool outgoing = 6;              // true=本机复制的  false=从对端收到的

  repeated ClipItem items = 7;
  int64 total_size = 8;
  string text_preview = 9;        // 文本/HTML 的预览片段，列表展示用

  int64 created_at_unix = 10;
  int64 expires_at_unix = 11;
  string error = 12;              // status=FAILED 时的具体原因

  // 能在界面里预览的图片数：剪贴板图片为 1，文件记录是其中图片文件的个数。
  // 由本机后台服务按文件名判断，HEIC、TIFF 这类格式只有能转换它的平台才算。
  int32 image_count = 13;

  // 这一条是收藏，不是复制记录。收藏的 expires_at_unix 为 0，表示不会过期
  bool favorite = 14;
  // 复制记录里的这一条已经收藏过（星标亮着）
  bool favorited = 15;
  int64 favorited_at_unix = 16;
  // 整条文字就是一个 http(s) 网址
  bool is_link = 17;
  // 用户给收藏起的别名，空表示没有。只有收藏有
  string alias = 18;
  // 经由哪台没配对的设备送进本机：手机网页传输里登记的手机名。只有 outgoing 的记录会有，
  // 界面上显示「来自 via_name」而不是「本机」
  string via_name = 19;
}

// ─────────────────────────── 事件流 ───────────────────────────

message SubscribeRequest {
  // 断线重连时带上最后收到的记录时间，daemon 补发这之后的记录
  int64 since_unix = 1;
}

message TransferProgress {
  string clip_id = 1;
  int64 transferred = 2;
  int64 total = 3;              // 0 表示总量未知（流式打包时）
  double bytes_per_second = 4;
}

enum ConnectionKind {
  CONNECTION_KIND_UNSPECIFIED = 0;
  CONNECTION_KIND_OFFLINE = 1;
  CONNECTION_KIND_DIRECT = 2;   // P2P 打洞成功
  CONNECTION_KIND_RELAY = 3;    // 经 TURN 中转
}

message Device {
  string id = 1;
  string name = 2;
  string platform = 3;            // darwin / windows / linux
  bool online = 4;
  ConnectionKind connection = 5;
  string public_key_fingerprint = 6;
  int64 paired_at_unix = 7;

  // 非空表示这是一条**待用户核对指纹**的配对请求，而非已配对设备。
  // 用此值调 ConfirmPairing 完成或拒绝配对。
  // 配对码的发起方是被动收到兑换通知的，靠这个字段把确认入口推给界面。
  string pairing_session = 8;
  // 对方声明能接收隔空传送（PeerFeatures 里有 send_files_v1）。旧版本为 false
  bool receives_files = 9;
  // 对方关闭了接收文件
  bool receive_disabled = 10;
  // 在同一个局域网里能直接找到对方，隔空传送的雷达据此把它放在内圈
  bool lan_reachable = 11;
  // 已经知道对方支持哪些功能（2.5.4 起）：收到过它的声明（含重启前存下的），
  // 或者连上 5 秒仍没收到、判定为旧版本。为 false 时 receives_files 只是「还不知道」，界面不能据此说对方要更新
  bool features_known = 12;
  // 对方声明里带的版本号，旧版本为空
  string app_version = 13;
}

// macOS 剪贴板授权状态，对应 NSPasteboardAccessBehavior。
// 非 ALWAYS_ALLOW 时 daemon 不会去读剪贴板内容，避免卡在授权弹窗上。
enum ClipboardPermission {
  CLIPBOARD_PERMISSION_UNSPECIFIED = 0;
  CLIPBOARD_PERMISSION_NOT_APPLICABLE = 1;  // 未启用隐私机制的系统
  CLIPBOARD_PERMISSION_DEFAULT = 2;
  CLIPBOARD_PERMISSION_ASK = 3;
  CLIPBOARD_PERMISSION_ALWAYS_ALLOW = 4;
  CLIPBOARD_PERMISSION_ALWAYS_DENY = 5;
}

message Event {
  oneof payload {
    ClipRecord clip_added = 1;
    ClipRecord clip_updated = 2;
    string clip_removed = 3;              // clip id
    TransferProgress progress = 4;
    Device device_changed = 5;
    ClipboardPermission permission_changed = 6;
    Status status_changed = 7;
    ClipboardWriteResult clipboard_written = 8;
    // 设置保存后推送，快捷窗口据此重新注册快捷键
    Config config_changed = 9;
    QuickPasteStatus quick_paste_changed = 10;
    // 隔空传送的一批新建、状态变化或进度更新（进度 0.2 秒节流）
    Transfer transfer_changed = 11;
    string transfer_removed = 12;         // transfer id
    // 让界面切到某一页："send" 是隔空传送页（用户点了隔空传送的通知）。
    // 界面是被这次点击拉起来的话还没订阅，后台服务在它订阅时补发最近 15 秒内的这一条
    string navigate = 13;
    // 好友（2.6.0）
    Friend friend_changed = 14;
    string friend_removed = 15;           // device id
    // 有人兑换了本机的好友码，界面弹出确认框
    FriendRequest friend_request = 16;
    Profile profile_changed = 17;
    // 手机网页传输的开关、监听状态或登记的手机变了；invite_used 是刚被扫码用掉的二维码
    WebShareStatus web_share_changed = 18;
  }
}

// ─────────────────────────── 好友 ───────────────────────────

message Profile {
  string display_name = 1;          // 实际用的名字（没设置时是系统的用户全名）
  string device_id = 2;
  bool has_avatar = 3;
  bytes avatar_hash = 4;
}

message SetDisplayNameRequest {
  string name = 1;                  // 空字符串表示恢复成系统的用户全名
}

message SetAvatarRequest {
  string path = 1;                  // 图片文件；为空时用剪贴板里的图片
  bytes image = 5;                  // 直接给图片数据（界面里粘贴、拖入时）
  // 裁剪区域，按原图的比例（0 到 1）；都为 0 时取中间最大的正方形
  double crop_x = 2;
  double crop_y = 3;
  double crop_size = 4;
}

message GetAvatarRequest {
  string device_id = 1;             // 空表示本机
}

message Avatar {
  bytes jpeg = 1;
  bytes avatar_hash = 2;
}

message FriendRef {
  string device_id = 1;
}

message SetFriendAutoAcceptRequest {
  string device_id = 1;
  bool auto_accept = 2;
}

// 好友就是对方的一台电脑
message Friend {
  string id = 1;
  string display_name = 2;
  string device_name = 3;
  string platform = 4;
  bool online = 5;
  ConnectionKind connection = 6;
  bool lan_reachable = 7;
  // 与 Device 相同：已经知道对方支持哪些功能
  bool features_known = 8;
  // 对方能接收好友发来的文件（声明了 send_files_ask_v1 且没有选「均不允许」）
  bool receives_files = 9;
  // 对方选了「均不允许」
  bool receive_disabled = 10;
  string app_version = 11;
  bool auto_accept = 12;
  int64 added_at_unix = 13;
  int64 last_activity_unix = 14;
  // 连不上的原因，见 design/friends-send.md 第 9.2 节：
  // ""（不用提示）、"self_no_service"（本机没开服务）、"peer_no_service"（对方没开服务）、
  // "different_server"（两边用的不是同一台服务器）
  string reachability = 15;
  bool has_avatar = 16;
  bytes avatar_hash = 17;
  string fingerprint = 18;
}

message ListFriendsResponse {
  repeated Friend friends = 1;
}

// 加好友时等待用户确认的对方信息
message FriendRequest {
  string session = 1;
  string device_id = 2;
  string display_name = 3;
  string device_name = 4;
  string platform = 5;
  // 两边的安全指纹，面对面时可以核对
  string fingerprint = 6;
  string self_fingerprint = 7;
}

// 附近开着「所有人」的陌生设备
message Stranger {
  string id = 1;
  string display_name = 2;
  string device_name = 3;
  string platform = 4;
  bool receives_files = 5;
}

message Strangers {
  repeated Stranger strangers = 1;
}

message PasteFilesResponse {
  repeated string paths = 1;
  bool image = 2;   // 是剪贴板里的图片存成的文件
}

message NotificationStatus {
  bool supported = 1;
  bool actions_supported = 2;
  // unknown, not_requested, allowed, denied, unavailable
  string permission = 3;
}

message NotificationAction {
  string clip_id = 1;
  string action = 2; // receive, apply, open
}

enum ClipboardWriteOutcome {
  CLIPBOARD_WRITE_OUTCOME_UNSPECIFIED = 0;
  CLIPBOARD_WRITE_OUTCOME_APPLIED = 1;
  CLIPBOARD_WRITE_OUTCOME_PRESERVED = 2;
  CLIPBOARD_WRITE_OUTCOME_FAILED = 3;
}

// READY still means downloaded, not necessarily the current system clipboard.
message ClipboardWriteResult {
  string clip_id = 1;
  ClipboardWriteOutcome outcome = 2;
  string error = 3;
}

// ─────────────────────────── 查询与操作 ───────────────────────────

message ListHistoryRequest {
  int32 limit = 1;
  int64 before_unix = 2;    // 分页游标
  // UNSPECIFIED 表示不过滤。TEXT 是界面上的「文字」：纯文本与网页格式，不含链接
  ClipKind kind_filter = 3;

  // 搜索词：非空时只返回文字内容或文件名包含它的记录（不分大小写），按时间倒序，
  // 忽略 before_unix。匹配处不在预览片段里的文字记录，text_preview 换成匹配处前后的一段。
  string query = 4;

  // true 时只返回收藏，按收藏时间倒序，忽略 before_unix；false 时只返回复制记录
  bool favorites = 5;
  // 只返回链接（is_link）
  bool links_only = 6;
}

message ListHistoryResponse {
  repeated ClipRecord records = 1;
  // 按 query 搜索过。旧版后台服务不认识 query，会照常返回全部记录，界面据此识别
  bool searched = 2;
}

message DeleteHistoryRequest {
  repeated string ids = 1;
  bool all = 2;
}

message FetchRequest {
  string clip_id = 1;
  bool preserve_clipboard = 2; // 预览下载：收完后不覆盖用户的剪贴板
}

message ApplyToClipboardRequest {
  string clip_id = 1;
  // 只写纯文本，去掉网页格式（快捷窗口里按 ⇧回车）
  bool plain_text = 2;
}

message SetFavoriteRequest {
  // 收藏时传复制记录的 ID；取消收藏时传收藏的 ID 或原记录的 ID 都可以
  string clip_id = 1;
  bool favorite = 2;
}

message SetAliasRequest {
  string clip_id = 1;
  string alias = 2;
}

message GetClipDetailRequest {
  string clip_id = 1;
}

message ClipDetail {
  // 文字的全文，网页格式给纯文本。最多前 4000 个字，保留换行
  string text = 1;
  // 全文的字数
  int32 text_length = 2;
  // 本机复制的文件在本机的完整路径
  repeated string source_paths = 3;
  // 图片和文件已在本机时，内容在本机的路径（缓存或收藏目录里，或者本机复制的原文件）。
  // Android 的「保存」「分享」用它；还没下载或已过期时为空
  repeated string local_paths = 4;
}

// ─────────────────────────── 快捷粘贴窗口 ───────────────────────────

message QuickPasteStatus {
  // 快捷窗口进程在运行（QuickPasteSession 连着）
  bool running = 1;
  // 快捷键注册失败的原因：空表示成功；in_use（被其他程序占用）、invalid、unsupported，
  // 或者平台给出的原文
  string hotkey_error = 2;
  // 实际生效的快捷键，与 Config.quick_paste_hotkey 同样的写法。Wayland 上是门户里用户设定的组合
  string hotkey = 3;
  // 选中后能自动粘贴
  bool paste_available = 4;
  // 不能自动粘贴的原因：not_trusted（Mac 未授予辅助功能）、wayland、copy_only（设置里选了只复制）
  string paste_unavailable_reason = 5;
  // 快捷键由谁触发：native（程序自己注册）、portal（Wayland 全局快捷键门户）、
  // system_shortcut（Wayland 上要用户在系统设置里添加快捷键）
  string hotkey_source = 6;
  // 快捷窗口的版本。App 更新后还在跑旧版的，界面让它按新的程序重新启动
  string version = 7;
}

message QuickPasteCommand {
  // request_permission：Mac 上请求辅助功能权限；
  // suspend_hotkey / resume_hotkey：设置页录制快捷键期间暂停全局快捷键；
  // show：呼出快捷窗口
  string command = 1;
}

// ─────────────────────────── 设备与配对 ───────────────────────────

message ListDevicesResponse {
  Device self = 1;
  repeated Device peers = 2;
}

message CreatePairingCodeResponse {
  string code = 1;
  int64 expires_at_unix = 2;
  // 本机的局域网地址，默认路由所在的网卡排第一。不在同一网段时，
  // 另一台要在输入配对码的同时输入其中一个。端口是默认值时省略端口。
  repeated string lan_addresses = 3;
}

// 在局域网和服务器上都找不到这个配对码时返回 NOT_FOUND；
// 找到了但配对码不对返回 INVALID_ARGUMENT；配对码已失效返回 FAILED_PRECONDITION。
message RedeemPairingCodeRequest {
  string code = 1;
  // 可选：对方配对码下面显示的地址（ip 或 ip:port），不在同一网段时填写
  string address = 2;
}

message RedeemPairingCodeResponse {
  // 返回对端信息供用户肉眼核对指纹，确认后再调 ConfirmPairing
  Device peer = 1;
  string pairing_session = 2;
}

message ConfirmPairingRequest {
  string pairing_session = 1;
  bool accept = 2;
}

// 附近一台打开了「搜索附近设备」窗口的设备。
message NearbyDevice {
  string id = 1;                  // 对方这次启动的 mDNS 实例名，用来发起配对
  string name = 2;
  string platform = 3;            // darwin / windows / linux
  bool paired = 4;                // 已经与本机配对
}

message NearbyDevices {
  repeated NearbyDevice devices = 1;
}

message PairNearbyRequest {
  string id = 1;
}

message UnpairRequest {
  string device_id = 1;
}

message ReconnectRequest {
  string device_id = 1;
}

message ReconnectResponse {
  ConnectionKind kind = 1;
}

message SetDeviceAddressRequest {
  string device_id = 1;
  string address = 2;             // ip 或 ip:port
}

// ─────────────────────────── 配置与状态 ───────────────────────────

message Config {
  // 小于此值自动预取，大于此值只同步元数据等用户手动拉取
  int64 auto_sync_threshold_bytes = 1;
  int64 history_ttl_seconds = 2;
  int64 cache_ttl_seconds = 3;

  bool sync_text = 4;
  bool sync_html = 5;
  bool sync_image = 6;
  bool sync_file = 7;

  // 收到对端内容后是否自动覆盖本机剪贴板
  bool auto_apply_to_clipboard = 8;
  bool launch_at_login = 9;

  string device_name = 10;
  string signaling_url = 11;

  // 只用自己的服务器探测网络出口，不用公共 STUN 服务器。
  // 默认 false（即允许公共服务器）：旧版界面不发这个字段时，不会被误关掉。
  bool only_own_stun = 12;

  // 界面语言：空字符串表示跟随系统；否则是 "zh-Hans"、"zh-Hant-TW"、"zh-Hant-HK"、"en"、"ja" 之一。
  // 存在后台服务这里而不是界面里：Windows 的托盘菜单由后台服务画，也要跟着变。
  string language = 13;

  // 不在局域网里查找设备、也不接受局域网里的配对请求。
  // 默认 false（即开启）：写成反向的，旧配置不用迁移。
  bool lan_disabled = 14;

  // Official service is opt-in; remembered custom URLs are inactive otherwise.
  ServiceMode service_mode = 15;
  string custom_signaling_url = 16;
  string official_notice_ack = 17;

  // 不自动检查更新。写成反向的：旧配置没有这一项时就是开启
  bool update_check_disabled = 18;
  // 用户选择跳过的版本，自动检查不再提示它；手动检查照常显示
  string update_skip_version = 19;

  // 关掉快捷粘贴窗口。写成反向的：旧配置没有这一项时就是开启
  bool quick_paste_disabled = 20;
  // 快捷键，如 "alt+v"、"ctrl+alt+v"，修饰键按 ctrl、alt、shift、meta 的顺序。
  // 空字符串表示默认：Mac 上 ⌥V，其他平台 Alt+V
  string quick_paste_hotkey = 21;
  // 选中后只放进剪贴板，不模拟粘贴
  bool quick_paste_copy_only = 22;

  // 隔空传送收到的文件存到哪里。空字符串表示系统的「下载」文件夹
  string receive_dir = 23;
  // 不接收其他设备发来的文件。写成反向的：旧配置没有这一项时就是开启
  bool receive_disabled = 24;
  // 收到文件时不发系统通知
  bool receive_notify_disabled = 25;
  // 隔空传送页里，传输列表放在雷达下面（上下排）。默认 false：放在雷达右边（左右排）
  bool send_layout_stacked = 26;
  bool realtime_sync_disabled = 27;
  bool sync_backlog = 28;
  repeated string sync_disabled_peers = 29;
  // 谁可以给我发文件（2.6.0）："off"（均不允许）、"friends"（仅限好友，默认）、"everyone"（所有人）。
  // 只管别人；自己设备之间的发送看 receive_disabled
  string receive_from = 30;
  // 「所有人」在这个时间自动回到「仅限好友」，Unix 秒。打开「所有人」时由后台服务填上
  int64 everyone_until_unix = 31;
  // 好友看到的名字，空表示系统的用户全名
  string display_name = 32;
  // 快捷粘贴窗口里按住哪个修饰键再按 1–9 粘贴对应的那一条（2.6.3）："alt"、"meta"、"ctrl"。
  // 空字符串表示默认：各平台都是 alt（Mac 上是 ⌥）
  string quick_paste_index_modifier = 33;
}

enum ServiceMode {
  SERVICE_MODE_UNSPECIFIED = 0;
  SERVICE_MODE_LAN = 1;
  SERVICE_MODE_OFFICIAL = 2;
  SERVICE_MODE_CUSTOM = 3;
}

message OfficialUsage {
  bool available = 1;
  string day = 2;
  string quota_group = 3;
  int64 upload_bytes = 4;
  int64 download_bytes = 5;
  int64 limit_bytes = 6;
  int64 remaining_bytes = 7;
  int64 reset_at_unix = 8;
  int64 updated_at_unix = 9;
  string reason = 10;
}

// 最近一轮网络出口探测的结果。
message NetworkInfo {
  int32 local_port = 1;           // 打洞共用的本地 UDP 端口
  repeated NetworkEgress egresses = 2;
  int32 probed = 3;               // 探测的服务器数（按 IP 去重后）
  int32 answered = 4;             // 有响应的服务器数
  int64 probed_at_unix = 5;
  LanInfo lan = 6;
}

// 局域网直连的诊断信息，见 pasteferry-cli nat。
message LanInfo {
  bool enabled = 1;
  int32 port = 2;                 // 局域网信令的 UDP 端口
  repeated string local_addresses = 3;
  int32 discovered = 4;           // mDNS 发现的 PasteFerry 实例数（含未配对的）
  repeated LanPeer peers = 5;
  bool blocked = 6;               // 系统拦下了本机发往局域网的包（macOS 本地网络权限）
}

message LanPeer {
  string device_id = 1;
  string device_name = 2;
  bool reachable = 3;
  string address = 4;             // 最近一次收到对方消息的地址
  repeated string known_addresses = 5;
  int64 last_seen_unix = 6;
}

message NetworkEgress {
  string address = 1;             // 本机在这个出口上的公网 ip:port
  bool port_preserved = 2;        // 这个出口不改端口
  bool guessed = 3;               // 按历史推算，而非本轮实测
  repeated string via = 4;        // 经由哪些探测服务器发现
}

message Status {
  string device_id = 1;
  string device_name = 2;
  bool signaling_connected = 3;
  ClipboardPermission clipboard_permission = 4;
  int64 cache_bytes_used = 5;
  int32 peers_online = 6;
  string version = 7;
  // 设置里填了服务器地址。没填时只在局域网里同步，不算异常。
  bool server_configured = 8;
  bool lan_enabled = 9;
  // 系统拦下了本机发往局域网的包：macOS 上是没允许「本地网络」权限
  bool lan_blocked = 10;
  // 详细日志打开到什么时候；0 表示没打开
  int64 verbose_log_until_unix = 11;
  OfficialUsage official_usage = 12;
  // 自动检查发现的新版本（没被跳过）；空表示没有要提示的
  string update_available = 13;
  // 刚完成的一次自动更新，界面据此提示「已更新到 X」；过一会儿就不再带
  UpdateResult last_update = 14;
}

message CheckForUpdateRequest {
  // 界面语言，用来挑更新日志："en"、"zh-Hans"、"zh-Hant-TW"、"zh-Hant-HK"、"ja"
  string language = 1;
}

message UpdateRelease {
  string version = 1;
  string date = 2;
  repeated string changes = 3;
  repeated string fixes = 4;
}

message UpdateInfo {
  string current_version = 1;
  string latest_version = 2;
  // latest_version 比当前新
  bool available = 3;
  // 比当前新的各版更新日志，从新到旧，已按语言挑好
  repeated UpdateRelease releases = 4;
  // 这台电脑要下载的安装包大小
  int64 download_bytes = 5;
  // 为空表示可以自动安装；否则是不能的原因：dev、must_move、read_only、unsupported
  string install_blocker = 6;
  // 清单来自哪里：github 或 gitee
  string source = 7;
  int64 checked_at_unix = 8;
  // 本机的安装方式：mac-app、windows-setup、windows-portable、linux-deb、linux-tar。
  // linux-deb 安装时系统会要求输入密码，界面提前说明
  string install_kind = 9;
}

message DownloadUpdateRequest {
  string version = 1;
}

message UpdateProgress {
  int64 downloaded = 1;
  int64 total = 2;
  // 下载完并通过校验
  bool done = 3;
}

message InstallUpdateRequest {
  string version = 1;
  // 界面的进程号：更新助手等它退出后再替换文件
  int32 ui_pid = 2;
}

message UpdateResult {
  string from_version = 1;
  string to_version = 2;
  bool ok = 3;
  string error = 4;
  int64 at_unix = 5;
}

message ExportDiagnosticsRequest {
  int32 log_lines = 1;     // 带上最近多少行日志
  string ui_version = 2;   // 界面的版本，写进报告
}

message Diagnostics {
  string report = 1;
}

message SetVerboseLogRequest {
  int32 minutes = 1;
}

message GetImagePreviewRequest {
  string clip_id = 1;
  int32 index = 2;   // 一条记录里有多张图片时看第几张，从 0 开始
}

message GetImagePreviewResponse {
  string path = 1;   // 界面可以直接解码的图片文件；HEIC 等格式是转换出来的 PNG
  int32 count = 2;   // 这条记录在本机实际能预览的图片数
  string name = 3;   // 文件名；剪贴板里的图片没有文件名，为空
}

// ─────────────────────────── 隔空传送 ───────────────────────────

message SendFilesRequest {
  string device_id = 1;
  // 拖进来或选中的文件与文件夹在本机的完整路径
  repeated string paths = 2;
  // 用户已确认可以经官方服务中转
  bool allow_relay = 3;
  // 备注，见 Transfer.note
  string note = 4;
}

message TransferRef {
  string id = 1;
}

enum TransferDirection {
  TRANSFER_DIRECTION_UNSPECIFIED = 0;
  TRANSFER_DIRECTION_OUTGOING = 1;
  TRANSFER_DIRECTION_INCOMING = 2;
}

message Transfer {
  string id = 1;
  TransferDirection direction = 2;
  string device_id = 3;
  string device_name = 4;
  // queued（排队）/ scanning（统计中）/ waiting（等对方应答或重新连接）/ active /
  // paused（官方中转额度用完）/ interrupted / done / failed / cancelled / declined / expired
  string status = 5;
  repeated ClipItem items = 6;       // 顶层的文件和文件夹
  // 收到的：顶层项目的最终路径（与 items 一一对应）；发出的：源路径
  repeated string paths = 7;
  int64 total_bytes = 8;
  int64 done_bytes = 9;
  int64 file_count = 10;
  double bytes_per_second = 11;
  // 失败、回绝、取消的原因，固定代码，界面翻译：no_space、dest_unavailable、
  // declined（对方拒绝）、timeout（对方没有回应）、not_allowed（对方不接收）、
  // file_too_large、disabled、unsupported、offline、source_changed、source_missing、
  // read_error、write_failed、hash_mismatch、cancelled、peer_cancelled、relay_quota 等
  string error = 12;
  int64 shortfall_bytes = 13;        // no_space 时还差多少
  bool relayed = 14;                 // 这一批经中转
  bool seen = 15;                    // 收到的：用户在隔空传送页看过
  int64 created_at_unix = 16;
  int64 finished_at_unix = 17;
  int64 scanned_files = 18;          // 统计阶段已找到的文件数
  string current_file = 19;          // 正在传的文件，相对路径；最多每 0.5 秒换一次
  int64 current_index = 20;          // 它是第几个文件，从 1 开始
  // 收到的：顶层项目是否还在原处（用户移走或删除后为 false），与 paths 一一对应
  repeated bool present = 21;
  // 收到的：文件名里有本机文件系统不允许的字符、改过名的文件数。只有 Windows 上会有：
  // : * ? " < > | \ 换成相近的全角字符，见 pack/names.go。文件内容不受影响
  int64 renamed_files = 22;
  // 对方是谁（2.6.0）："self"（自己的设备）、"friend"、"stranger"（「所有人」模式下的陌生设备）
  string peer_role = 23;
  // 备注
  string note = 24;
  // 收到的图片的缩略图（本机重新编码过的 PNG），与 items 一一对应，不是图片的为空
  repeated string thumbs = 25;
}

message AnswerIncomingRequest {
  string transfer_id = 1;
  bool accept = 2;
  // 以后自动接收这个好友的文件（陌生设备忽略）
  bool always = 3;
}

message ListTransfersRequest {
  TransferDirection direction = 1;   // UNSPECIFIED 表示两类都要
  int32 limit = 2;
  int64 before_unix = 3;             // 分页游标
}

message ListTransfersResponse {
  repeated Transfer transfers = 1;
}

message DeleteTransfersRequest {
  repeated string ids = 1;
  bool all = 2;
  TransferDirection direction = 3;   // all 时只清这一类；UNSPECIFIED 表示两类都清
}

message CheckReceiveDirRequest {
  string path = 1;
}

message CheckReceiveDirResponse {
  bool ok = 1;
  // not_found / not_directory / not_writable / permission_denied
  string error = 2;
  int64 free_bytes = 3;
  // 实际检查的位置：path 为空时是当前设置的位置，没设置时是系统的「下载」文件夹
  string path = 4;
}

message SubmitTextRequest {
  string text = 1;
}

// ─────────────────────────── 手机网页传输 ───────────────────────────

message WebShareStatus {
  bool enabled = 1;
  // 开关打开且端口已在监听
  bool listening = 2;
  int32 port = 3;
  // 固定端口被占用，改用了随机端口：以前收藏的网址打不开，要重新扫码
  bool port_fallback = 4;
  // 监听失败的原因（开关开着但没在监听时）
  string error = 5;
  // 本机的局域网地址（不带端口），默认路由所在的网卡排第一
  repeated string addresses = 6;
  repeated WebSession sessions = 7;
  // 刚被扫码用掉的二维码（只在 web_share_changed 事件里有），二维码窗口据此换一张新的
  string invite_used = 8;
}

message WebSession {
  string id = 1;
  string name = 2;                  // 手机第一次打开网页时起的名字
  int64 created_at_unix = 3;
  int64 last_seen_unix = 4;
}

message SetWebShareRequest {
  bool enabled = 1;
}

message NewWebShareInviteRequest {
  string address = 1;               // 二维码里用哪个地址；空表示默认（WebShareStatus.addresses 的第一个）
}

message WebShareInvite {
  string id = 1;
  string url = 2;                   // 二维码内容：http://地址:端口/#i=邀请&k=密钥
  int64 expires_at_unix = 3;
  // 二维码点阵，界面按它画方块：边长（模块数）与按行排列的模块，每个字节一个，1 为深色
  int32 qr_size = 4;
  bytes qr_modules = 5;
}

message WebShareInviteRef {
  string id = 1;
}

message WebSessionRef {
  string id = 1;
}
