// 线上协议：客户端 ↔ 信令服务器，同一局域网里的设备 ↔ 设备（UDP），
// 以及连通之后的设备 ↔ 设备（DataChannel）。
//
// 信令服务器只转发、不解密内容，也不存用户——设备靠配对时交换的
// Ed25519 公钥互相认证。所有经服务器或局域网转发的信令都带签名，
// 防止服务器或同一网络里的其他人伪造 peer 身份做中间人。

syntax = "proto3";

package pasteferry.v1;

// ClipKind / ClipItem 在此复用，避免两套等价定义
import "pasteferry/v1/daemon.proto";

option go_package = "github.com/baiyuze/pasteferry/proto/gen/pasteferry/v1;pasteferryv1";

// ═══════════════════ 信令层（WebSocket 承载）═══════════════════

// 经服务器转发的消息一律包一层签名。接收方用配对时存下的
// 对端公钥验签，服务器无法伪造。
message Signed {
  bytes payload = 1;        // 序列化后的 SignalMessage
  bytes signature = 2;      // Ed25519 签名，覆盖 payload
  string from_device_id = 3;
}

message SignalMessage {
  // 防重放：接收方拒绝时间戳过旧或 nonce 重复的消息
  int64 timestamp_unix = 1;
  bytes nonce = 2;
  // 接收方只收发给自己的消息：局域网里谁都能把截到的消息转发给第三台设备
  string to_device_id = 3;
  // Client-only negotiation metadata; the server forwards Signed unchanged.
  string connection_attempt_id = 4;
  bool official_relay = 5;
  bool gateway_capable = 6;
  // Fixed relay-only denial codes; these never change pairing or direct trust.
  string relay_denial_code = 7;

  oneof payload {
    SdpOffer offer = 10;
    SdpAnswer answer = 11;
    IceCandidate candidate = 12;
    Ping ping = 13;
    LanHello lan_hello = 14;        // 只走局域网，见下文
    RetryDirect retry_direct = 15;
    // 配对码兑换后、用户确认前，两边告诉对方这次是配对还是加好友（2.6.0）。
    // 旧版本不发：没收到就当作配对
    PairIntent pair_intent = 16;
    // 加好友：本端的用户点了「添加」或「取消」。两边都添加了才算好友
    FriendConfirm friend_confirm = 17;
    // 「所有人」模式下陌生设备之间交换的名片，见 design/friends-send.md 第 9.1 节
    StrangerHello stranger_hello = 18;
    FriendRemove friend_remove = 19;
  }
}

// 配对码兑换后各自发一次，直到收到对方的。intent 是 "device"（配对）或 "friend"（加好友）
message PairIntent {
  string intent = 1;
  // 加好友时带上名片，确认框里显示对方的名字
  FriendCard card = 2;
}

message FriendConfirm {
  bool accepted = 1;
}

// 「所有人」模式：发送方先发，接收方开着「所有人」时回一条（reply = true）。
// 公钥随签名的局域网配对信息交换（见 LanPacket.stranger），这里只带显示用的名片
message StrangerHello {
  FriendCard card = 1;
  bool reply = 2;
}

// 用户在应答方点了「重新连接」：只有发起方能做 ICE 重启，请它马上再试一次直连。
// 旧版本不认识它，照旧按自己的间隔重试
message RetryDirect {}

message SdpOffer {
  string sdp = 1;
  // DTLS 证书指纹。经签名传输，杜绝信令服务器中间人攻击——
  // 这是 P2P 通道真正的安全锚点。
  string dtls_fingerprint = 2;
  // 应答方先别发自己的出口地址：等收到发起方的出口地址、先往那边发过包再发。
  // 默认（false）是发起方这样等。谁先发包决定了谁的路由器先收到对方的包，
  // 有的路由器会因此占住端口、打洞失败，所以换直连的重试里两种顺序轮流用。
  bool answerer_waits = 3;
}

message SdpAnswer {
  string sdp = 1;
  string dtls_fingerprint = 2;
}

message IceCandidate {
  string candidate = 1;
  string sdp_mid = 2;
  uint32 sdp_mline_index = 3;
}

message Ping {
  int64 sent_at_unix = 1;
}

// ── 客户端 → 服务器（不经转发，直接处理）──

message ClientHello {
  string device_id = 1;
  string device_name = 2;
  string platform = 3;
  bytes public_key = 4;             // Ed25519
  bytes signature = 5;              // 对 challenge 的签名，证明持有私钥
  repeated string paired_device_ids = 6;  // 关心哪些对端的在线状态
}

message ServerHello {
  bytes challenge = 1;
  repeated IceServer ice_servers = 2;
  int64 server_time_unix = 3;
}

message IceServer {
  repeated string urls = 1;
  string username = 2;              // TURN 短期凭证
  string credential = 3;
  int64 expires_at_unix = 4;
}

message PeerPresence {
  string device_id = 1;
  bool online = 2;
}

// ── 配对 ──

message PairingCreateRequest {
  string device_name = 1;
  bytes public_key = 2;
}

message PairingCreateResponse {
  string code = 1;                  // 6 位，服务器侧 TTL 5 分钟
  int64 expires_at_unix = 2;
}

message PairingRedeemRequest {
  string code = 1;
  string device_id = 2;
  string device_name = 3;
  bytes public_key = 4;
}

message PairingRedeemResponse {
  string peer_device_id = 1;
  string peer_device_name = 2;
  string peer_platform = 3;
  bytes peer_public_key = 4;
}

// 服务器 → 发起方：有人兑换了你的配对码
message PairingRedeemed {
  string peer_device_id = 1;
  string peer_device_name = 2;
  string peer_platform = 3;
  bytes peer_public_key = 4;
}

// TURN 凭证是按设备签发且有有效期的，因此必须在认证完成后才能下发，
// 之后也会在临近过期时重新推送。
message IceConfig {
  repeated IceServer ice_servers = 1;
}

// 客户端 ↔ 服务器的顶层信封
message ServerEnvelope {
  oneof payload {
    ServerHello hello = 1;
    Signed forwarded = 2;           // 转发自其他设备
    PeerPresence presence = 3;
    PairingCreateResponse pairing_created = 4;
    PairingRedeemResponse pairing_redeemed_result = 5;
    PairingRedeemed pairing_redeemed = 6;
    ServerError error = 7;
    IceConfig ice_config = 8;
  }
}

message ClientEnvelope {
  oneof payload {
    ClientHello hello = 1;
    Signed forward = 2;             // 请服务器转发给 to_device_id
    PairingCreateRequest pairing_create = 3;
    PairingRedeemRequest pairing_redeem = 4;
  }
}

message ServerError {
  string code = 1;
  string message = 2;
}

// ═══════════════════ 局域网层（UDP 承载）═══════════════════
//
// 同一局域网里的设备不经服务器，用固定的 UDP 端口直接互发 LanPacket，
// 每个包前面加 4 字节魔数 "CSL1"。设备靠 mDNS（_pasteferry._udp）互相发现。
//
// 已配对设备之间发的是与服务器转发时完全相同的 Signed，信任模型不变。
// 只有魔数、没有内容的空包是「敲门」：显示配对码的一方看到有人在找人配对（mDNS 里带 s=1），
// 先往对方发一个，让本机的有状态防火墙放行对方随后的配对请求。收到的一方直接忽略。
// 配对请求与回复各自用发送方自带的公钥签名：这只能证明发送方持有那把私钥，
// 防中间人仍然靠双方肉眼核对指纹——与经服务器配对时一样。
//
// 「搜索附近设备」：窗口打开期间，mDNS 广播里带上设备名（n，base64url 编码的 UTF-8）
// 和系统（o）。两台都打开时互相看得到，每 2 秒互发一个 LanNearbyPing：
// mDNS 不会通知实例下线，靠它判断对方还在；它也是敲门，让对方的配对请求进得来。
// ping 自带名字、系统和令牌：mDNS 只在实例有变化时才报，收到的一方可能早把它过期丢掉了。
// 点了对方就发 nearby_request：与 pair_request 相同，只是不带配对码，
// 对方只在窗口打开期间接受。回复仍是 pair_response 或 pair_reject。

message LanPacket {
  oneof payload {
    Signed signal = 1;
    LanPairSigned pair_request = 2;
    LanPairSigned pair_response = 3;
    LanPairReject pair_reject = 4;
    LanPairSigned nearby_request = 5;
    LanNearbyPing nearby_ping = 6;
    // 「所有人」模式（2.6.0）：向开着「所有人」的陌生设备要它的公钥，以便给它发文件。
    // 请求与回复都带名片（LanPairInfo.card），不带配对码
    LanPairSigned stranger_request = 7;
  }
}

// 已配对设备之间的上线通知。还没连通时定期发，连通后低频保活。
// 两端都往对方发，有状态的防火墙（Windows）会放行对方的包。
message LanHello {
  repeated string addresses = 1;    // 发送方本机的局域网地址，ip:port
  bool reply_wanted = 2;            // 收到后回一条，让发送方也知道本端可达
  uint32 interval_seconds = 3;      // 发送方多久发一次；超过三倍没收到即视为不可达
  // 发送方每次启动时随机生成。变了说明对方重启过，旧的 P2P 连接已经失效，
  // 要立即重建，而不是等连接超时（用服务器时，这件事由上下线通知完成）
  bytes boot = 4;
}

// payload 是序列化后的 LanPairInfo，signature 用 LanPairInfo.public_key 签名。
message LanPairSigned {
  bytes payload = 1;
  bytes signature = 2;
}

message LanPairInfo {
  string code = 1;                  // 请求里是用户输入的配对码；回复里为空
  string device_id = 2;
  string device_name = 3;
  string platform = 4;
  bytes public_key = 5;
  repeated string addresses = 6;    // 发送方本机的局域网地址，ip:port
  int64 timestamp_unix = 7;
  bytes nonce = 8;
  bytes request_nonce = 9;          // 回复里回显请求的 nonce，把回复绑定到这次请求
  // 这次是配对（"device"，旧版本不带）还是加好友（"friend"，2.6.0）。
  // 显示码的一方发现与自己开放的不一致时回绝（intent_device / intent_friend），不用掉这个码
  string intent = 10;
  // 加好友时带上名片
  FriendCard card = 11;
}

message LanPairReject {
  bytes request_nonce = 1;
  string reason = 2;                // wrong_code / closed / too_many_attempts
}

message LanNearbyPing {
  string instance = 1;              // 发送方的 mDNS 实例名
  string name = 2;                  // 与广播里的 n、o、t 相同（名字不编码）
  string platform = 3;
  string token = 4;
}

// ═══════════════════ 设备间协议（DataChannel 承载）═══════════════════
//
// 控制消息与数据流走不同的 DataChannel，避免大文件传输阻塞控制通道。

// 控制通道消息
message PeerMessage {
  oneof payload {
    ClipOffer offer = 1;            // 广播：我这边复制了东西
    PeerFetch fetch = 2;            // 请求：把某条内容发给我
    FetchReject reject = 3;         // 拒绝：源文件没了 / 已过期
    TransferHeader header = 4;      // 数据流即将开始
    TransferDone done = 5;
    LinkInfo link = 6;              // 连接建立后互相告知本端是否经中转
    PeerDisplay display = 7;        // 仅通过加密的设备间通道交换真实名称
    PeerFeatures features = 8;      // 连接建立后互相告知本端支持哪些功能
    // 隔空传送：把文件直接发给某一台设备，见 design/send-files.md
    SendOffer send_offer = 9;
    SendAnswer send_answer = 10;
    SendCancel send_cancel = 11;
    SendResult send_result = 12;
    // 好友（2.6.0）：连上后各自发一次名片；名片里的头像哈希变了才要头像
    FriendCard friend_card = 13;
    AvatarRequest avatar_request = 14;
    AvatarData avatar_data = 15;
  }
}

// 好友看到的本机信息。只在加密通道里、发给好友或陌生设备
message FriendCard {
  string display_name = 1;
  string device_name = 2;
  string platform = 3;
  // 本机用的是哪种服务：official / custom / lan，判断两边能不能跨网络找到对方
  string service = 4;
  // 自建服务器地址的哈希（SHA-256 的前 16 字节），判断是不是同一台；不带地址本身
  bytes custom_server_hash = 5;
  // 头像的哈希，空表示用默认头像
  bytes avatar_hash = 6;
}

// 删除好友。走签名的信令（不用先建 P2P 连接）；收到的一方删掉后回一条 ack = true，
// 发出的一方收到回执才不再补发
message FriendRemove {
  int64 at_unix = 1;
  bool ack = 2;
}

message AvatarRequest {
  bytes avatar_hash = 1;
}

message AvatarData {
  bytes avatar_hash = 1;
  bytes jpeg = 2;   // 最大 64 KB
}

// 连接就绪后各自发一次，与 LinkInfo 一起；功能开关变了再发一次。
// 旧版本不发，也不认识它，对方据此当作不支持。
message PeerFeatures {
  // "send_files_v1"：能接收隔空传送。关闭了接收时不带它，改带 "send_files_off"，
  // 对方的雷达显示「不接收文件」而不是「需要更新」
  repeated string features = 1;
  // 发出这条声明的版本号（2.5.4 起）。只用来在界面上提示「需要更新到哪个版本」，不用来判断功能
  string app_version = 2;
}

// 连接就绪后各自发一次。只有本端能确定自己发出的数据是否走 TURN：
// 对端经中转发来的包，在本端看来可能只是一个普通地址（peer-reflexive），
// 单靠自己的视角会把中转误判成直连。两端交换后，任一端经中转即显示为中转。
message LinkInfo {
  bool relayed = 1;
}

message PeerDisplay {
  string name = 1;
  string platform = 2;
}

// 复制发生时广播给所有在线对端。
// 小于阈值的内容会紧接着主动推送；大于阈值的只发这条，等对方来取。
message ClipOffer {
  string clip_id = 1;
  ClipKind kind = 2;
  repeated ClipItem items = 3;
  int64 total_size = 4;
  string text_content = 5;          // 文本/HTML 直接内联，无需二次传输
  int64 created_at_unix = 6;
  bool will_push = 7;               // true=发送方会主动推，false=需 fetch
  // HTML 的纯文本形式（此时 text_content 是 HTML 标记）。旧版本不发这个字段，
  // 收到空值时由接收方从 HTML 中提取。
  string plain_text = 8;
  // 补发：复制时对端连不上，连接恢复后才发过去的旧内容。
  // 只进复制记录，不写进对端的剪贴板，免得覆盖对方此刻正在用的内容。
  bool backlog = 9;
}

// 与 daemon.proto 的 FetchRequest（UI→daemon）区分：这条是 daemon→peer
message PeerFetch {
  string clip_id = 1;
}

message FetchReject {
  string clip_id = 1;
  string reason = 2;                // source_missing / expired / denied
}

// 数据流的第一条消息，之后是裸字节流直到 total_bytes
message TransferHeader {
  string clip_id = 1;
  string stream_id = 2;
  int64 total_bytes = 3;            // 压缩后的字节数；0 表示未知（流式打包）
  Compression compression = 4;
  Packaging packaging = 5;
}

enum Compression {
  COMPRESSION_UNSPECIFIED = 0;
  COMPRESSION_NONE = 1;
  COMPRESSION_ZSTD = 2;
}

enum Packaging {
  PACKAGING_UNSPECIFIED = 0;
  PACKAGING_RAW = 1;                // 单个文件，裸内容
  PACKAGING_TAR = 2;                // 多文件或目录
}

message TransferDone {
  string clip_id = 1;
  string stream_id = 2;
  bool ok = 3;
  string error = 4;
  bytes sha256 = 5;
}

// ═══════════════════ 隔空传送（DataChannel 承载）═══════════════════
//
// 发送方 SendOffer → 接收方 SendAnswer（接受并给出续传位置，或回绝）→
// 发送方新开数据通道 "send:<transfer_id>:<attempt>"，发 zstd 压缩的帧流 →
// 接收方全部写完、校验、移到保存位置后回 SendResult。
// 中断后发送方用同一个 transfer_id、更大的 attempt 再发 SendOffer（resume），从断点继续。

message SendOffer {
  string transfer_id = 1;
  // 第几次发起，从 1 开始。数据通道名带上它，旧的通道晚到时直接丢弃
  uint32 attempt = 2;
  // 顶层的文件和文件夹，显示用；文件夹的 size 是里面文件的总大小
  repeated ClipItem items = 3;
  int64 total_bytes = 4;
  int64 file_count = 5;
  // 最大的单个文件，接收方据此判断 FAT32 这类单文件 4 GB 的上限
  int64 largest_file = 6;
  int64 created_at_unix = 7;
  // 续传：同一个 transfer_id 再次发起
  bool resume = 8;
  // 备注（2.6.0）：最多 200 个字符、单行，必须附在文件上
  string note = 9;
}

message SendAnswer {
  string transfer_id = 1;
  uint32 attempt = 2;
  bool accepted = 3;
  // 回绝的原因，固定代码：disabled / no_space / dest_unavailable / file_too_large /
  // busy / unknown_transfer / cancelled；already_done（2.5.1）：续传时发现上次已经收完，发送方直接标为送达
  string reason = 4;
  int64 shortfall_bytes = 5;        // no_space 时还差多少
  int64 resume_index = 6;           // 从第几个条目开始（全新传输为 0）
  int64 resume_offset = 7;          // 这个条目已经收到多少字节
  // 局域网快速通道（2.5.1）：接收方为这次尝试临时监听的 TCP 地址（ip:port）。
  // 只在两端都声明 send_files_tcp_v1、且当前连接是局域网直连时给出；为空或连不上时走数据通道
  string lan_addr = 8;
}

// 任何一方取消，或者发送方读源文件出错时发出。对方停下并清理没收完的部分
message SendCancel {
  string transfer_id = 1;
  // cancelled / source_changed / source_missing / read_error / dest_unavailable
  string reason = 2;
}

// 接收方全部收完（或中途失败）后回给发送方
message SendResult {
  string transfer_id = 1;
  uint32 attempt = 2;
  bool ok = 3;
  // hash_mismatch / write_failed / dest_unavailable / bad_stream
  string error = 4;
  int64 failed_index = 5;
}

// 隔空传送数据流里的帧：4 字节大端长度 + 序列化的 SendFrame。
// file 之后紧跟 size - offset 个字节的文件内容（目录和链接没有内容），
// 普通文件的内容之后是 file_end。最后是 end。整个帧流再经 zstd 压缩。
message SendFrame {
  oneof payload {
    SendFileStart file = 1;
    SendFileEnd file_end = 2;
    SendStreamEnd end = 3;
  }
}

message SendFileStart {
  int64 index = 1;                  // 在清单里的序号，从 0 开始
  string path = 2;                  // 相对路径，正斜杠分隔，第一段是顶层项目的名字
  int64 size = 3;
  bool is_dir = 4;
  uint32 mode = 5;                  // 权限位，只用来保留可执行位
  int64 mtime_unix = 6;
  int64 offset = 7;                 // 从文件的第几个字节开始发（续传）
  string link_target = 8;           // 非空表示这是符号链接
}

message SendFileEnd {
  bytes sha256 = 1;                 // 整个文件的 SHA-256，续传时也是整个文件的
}

message SendStreamEnd {}
