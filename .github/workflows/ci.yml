name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动运行：开发中的分支（比如 windows）不必合进 main 也能跑一遍
  workflow_dispatch:

jobs:
  security:
    name: Go dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client-core/go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
        working-directory: client-core
      - run: govulncheck ./...
        working-directory: server

  server:
    name: 服务器
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./... && go test ./...
        working-directory: server

  client-core:
    name: 后台服务
    # 剪贴板部分是 cgo + AppKit，只能在 macOS 上编译。Linux、Windows 上的测试在各自的客户端任务里
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client-core/go.mod
          cache-dependency-path: client-core/go.sum
      - run: go vet ./... && go test ./...
        working-directory: client-core

  ui:
    name: 界面
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: ui

  natlab:
    name: NAT 打洞实验室
    # 用网络命名空间与 iptables 搭出多出口、对称 NAT 等拓扑，验证直连与中转兜底
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client-core/go.mod
          cache-dependency-path: client-core/go.sum
      - run: CGO_ENABLED=0 go build -o /tmp/natlab ./cmd/natlab
        working-directory: client-core
      - run: sudo bash tools/natlab/run.sh /tmp/natlab

  windows:
    name: Windows 客户端
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client-core/go.mod
          cache-dependency-path: client-core/go.sum
      - run: go vet ./... ; if ($LASTEXITCODE) { exit 1 } ; go test ./...
        working-directory: client-core
      # 单独列出剪贴板测试的每一条：没有交互式桌面时它们会跳过，要看得出来
      - run: go test -v -count=1 -run Windows ./internal/clipboard/
        working-directory: client-core
      # 服务器也能装在 Windows 上，作为系统服务运行
      - run: go vet ./... ; if ($LASTEXITCODE) { exit 1 } ; go test ./...
        working-directory: server
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get ; flutter analyze ; if ($LASTEXITCODE) { exit 1 } ; flutter test
        working-directory: ui
      - name: 安装 Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - run: powershell -ExecutionPolicy Bypass -File scripts\build-windows.ps1
      # 构建好的安装包与便携版留作下载，方便在真机上试
      - uses: actions/upload-artifact@v4
        with:
          name: PasteFerry-windows
          path: |
            dist/windows/PasteFerry-Setup.exe
            dist/windows/PasteFerry-windows-x64.zip

  linux:
    name: Linux 客户端（${{ matrix.arch }}）
    # Flutter 不能交叉编译 Linux 桌面程序，两种架构各用一台机器。
    # 在 22.04 上构建：产物依赖的 glibc 与 GTK 版本较老，新的发行版也能运行
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client-core/go.mod
          cache-dependency-path: client-core/go.sum
      - name: 安装构建依赖
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxtst-dev xvfb xclip dbus-x11
      # flutter-action 不提供 Linux ARM64 的 Flutter，两种架构都直接取 stable 分支
      - name: 安装 Flutter
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      # X11 剪贴板的测试在虚拟显示器里跑，xclip 扮演别的程序
      - run: go vet ./... && dbus-run-session -- xvfb-run -a go test ./...
        working-directory: client-core
      - run: xvfb-run -a go test -v -count=1 -run Linux ./internal/clipboard/
        working-directory: client-core
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: ui
      - run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PasteFerry-linux-${{ matrix.arch }}
          path: |
            dist/linux/PasteFerry-linux-${{ matrix.arch }}.deb
            dist/linux/PasteFerry-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
